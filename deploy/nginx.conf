# RentMate Nginx 反向代理（P1：基本路由；P2 會在此加上 rate limit、安全標頭、TLS）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 隱藏 Nginx 版本號
    server_tokens off;

    # OCR 上傳上限，對齊 OCR_MAX_TOTAL_SIZE_MB（預設 80MB）
    client_max_body_size 80m;

    # OCR 端點 → ocr 容器（prefix 比 /api/ 長，Nginx 會優先匹配）
    location /api/ocr {
        proxy_pass http://ocr:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR + AI 審查耗時較長
        proxy_read_timeout 300s;
    }

    # 其餘 API → fastapi 容器
    location /api/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 分析端點耗時較長
        proxy_read_timeout 300s;
    }

    # SPA fallback：非 API 路徑一律回 index.html，由 vue-router 處理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
