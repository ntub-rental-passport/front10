# RentMate ZAP Full Scan 專用隔離測試環境
#
# 與正式站完全隔離：
#   - 獨立 project 名（-p rentmate-test）、獨立 network、獨立資料庫 volume
#   - 假 SMTP（mailhog）：ZAP 灌爆註冊端點也不會真的寄信
#   - 假金鑰：不燒任何真實 API 額度
#   - 不映射任何對外埠：ZAP 在同 network 內以容器名存取，外界完全打不到
#   - 複用正式已 build 的 image（rentmate-fastapi / rentmate-ocr / rentmate-web）
#
# 用法：
#   bash deploy/test/gen-test-cert.sh
#   docker compose -p rentmate-test -f deploy/test/docker-compose.test.yml up -d
#   （ZAP 另以 docker run --network rentmate-test_test_net 加入此網路施打 https://web）
#   docker compose -p rentmate-test -f deploy/test/docker-compose.test.yml down -v  # 用完清除

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "test_root_pw"
      MYSQL_DATABASE: "115-RentMate"
      MYSQL_USER: "rentmate"
      MYSQL_PASSWORD: "test_app_pw"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [test_net]

  mailhog:
    image: mailhog/mailhog        # 假 SMTP：接收郵件但不寄出，可在 web UI 查看
    networks: [test_net]

  fastapi:
    image: rentmate-fastapi       # 複用正式已 build 的映像
    environment:
      DATABASE_URL: "mysql+pymysql://rentmate:test_app_pw@mysql:3306/115-RentMate"
      JWT_SECRET: "test_only_jwt_secret_not_for_production_use_00000000"
      COOKIE_SECURE: "true"
      CORS_ORIGINS: "https://web,https://localhost"
      TEST_LANDLORD_PASSWORD: "zap-test-Landlord-2026"
      TEST_TENANT_PASSWORD: "zap-test-Tenant-2026"
      OLLAMA_URL: "http://127.0.0.1:11434"   # 測試環境無 Ollama，analyze/chat 會走 fallback
      GOOGLE_CLIENT_ID: "test-client-id.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "test-secret"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SMTP_USERNAME: "test@example.com"
      SMTP_APP_PASSWORD: "test"
      SMTP_FROM_EMAIL: "test@example.com"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [test_net]

  ocr:
    image: rentmate-ocr
    environment:
      JWT_SECRET: "test_only_jwt_secret_not_for_production_use_00000000"
      GOOGLE_APPLICATION_CREDENTIALS: "/keys/fake.json"
    volumes:
      - ./fake-vision-key.json:/keys/fake.json:ro   # 假金鑰，且 requireAuth 會先擋下匿名請求
    networks: [test_net]

  web:
    image: rentmate-web
    volumes:
      # 用自簽憑證測 HTTPS，覆蓋映像內依賴正式網域憑證的設定
      - ./nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/test-certs:ro
    depends_on: [fastapi, ocr]
    networks: [test_net]

networks:
  test_net:
