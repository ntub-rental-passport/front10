# ZAP 測試環境專用 Nginx 設定（純 HTTP）
# 保留與正式站相同的應用層防護（限流、安全標頭、CSP、隱藏檔封鎖），
# 但移除 TLS / HSTS / certbot / Cloudflare 相關設定（測試環境無憑證、走 HTTP）。
# 目的：讓 ZAP 測到與正式站相同的應用層防護表現。

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ocr_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 80m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.gstatic.com https://cdn.jsdelivr.net https://api.qrserver.com https://placehold.co https://picsum.photos https://tiles.openfreemap.org https://*.googleusercontent.com; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://tiles.openfreemap.org https://nominatim.openstreetmap.org; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ocr {
        limit_req zone=ocr_limit burst=2 nodelay;
        proxy_pass http://ocr:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location ~ /\. {
        deny all;
        access_log off;
    }
    location ~* \.(env|sql|bak|old|conf|ini|log|sh)$|wp-config|phpinfo {
        deny all;
        access_log off;
    }
    # 帶靜態資源副檔名的請求找不到回 404，不落入 SPA fallback（消除 Backup File Disclosure 假陽性）
    location ~* \.(js|mjs|css|map|json|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        limit_req zone=static_limit burst=60 nodelay;
        try_files $uri =404;
    }
    location / {
        limit_req zone=static_limit burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
