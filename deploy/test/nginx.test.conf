# ZAP 測試環境專用 Nginx 設定（HTTPS，自簽憑證）
# 保留與正式站相同的 TLS / HSTS 與應用層防護（限流、安全標頭、CSP、隱藏檔封鎖），
# 只省略 certbot / Cloudflare 與正式網域設定；先執行 gen-test-cert.sh 產生憑證。
# 目的：讓 ZAP 測到與正式站一致的 HTTPS 防護表現。

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ocr_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/test-certs/cert.pem;
    ssl_certificate_key /etc/nginx/test-certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;                 # 停用 TLS 1.0/1.1
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 80m;

    # 正式 CORS 僅允許本站；desktop/ 已無用戶端程式，開發前端也走 /api 代理。
    # 不需要 OPTIONS preflight；擋掉其他方法，避免 TRACE/TRACK 等洩漏代理資訊。
    # 自訂 405 內容，避免預設錯誤頁帶出伺服器名稱；if 內只使用合法的 return。
    if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE)$") {
        return 405 "Method Not Allowed\n";
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), payment=()" always;
    # 與正式站相同的 HSTS，讓掃描也涵蓋 HTTPS 防護。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 隔離瀏覽環境，防止跨來源視窗操作本頁；Google 登入是整頁轉址，不需要彈窗相容。
    # 通知鈴鐺的 window.open 已設 noopener,noreferrer；補助文件開 about:blank 後寫入，
    # 仍是 same-origin，兩者在此政策下都能正常使用。
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 只限制別站嵌入本站資源，不影響本站自己載入外部圖片。
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # 不用 require-corp：外部圖片沒有 CORP 標頭會被擋。
    # credentialless 讓跨來源 no-cors 請求不帶 cookie 載入；本站外部圖片都是公開資源，故不受影響。
    # 不支援的瀏覽器（如 Safari）會忽略此標頭，不會壞掉。
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    # style-src 暫時保留 'unsafe-inline'（2026-10-10）：原先認為 Vue :style 需要它，仍待驗證。
    # Vue 透過 CSSOM el.style 設定 :style，CSP 不限制此方式；真正可能需要的是
    # 會自行插入 <style> 的套件（如 motion）。先用 Report-Only 觀察 console 違規，
    # 確認沒有違規再移除強制 CSP 的 'unsafe-inline'；不設 report-uri，不傳送違規報告。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.gstatic.com https://cdn.jsdelivr.net https://api.qrserver.com https://placehold.co https://picsum.photos https://tiles.openfreemap.org https://*.googleusercontent.com; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://tiles.openfreemap.org https://nominatim.openstreetmap.org; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://www.gstatic.com https://cdn.jsdelivr.net https://api.qrserver.com https://placehold.co https://picsum.photos https://tiles.openfreemap.org https://*.googleusercontent.com; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://tiles.openfreemap.org https://nominatim.openstreetmap.org; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ocr {
        limit_req zone=ocr_limit burst=2 nodelay;
        proxy_pass http://ocr:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    # 容器之間專用的端點（OCR 服務回報 Vision 用量，見 backend/routers/ai_usage_api.py）：
    # OCR 容器直接連 fastapi:8000，不經過這裡，所以從外面進來的一律擋掉。
    # 端點本身也要服務憑證，這裡是多一層。
    location ^~ /api/internal/ {
        return 404;
    }

    # ^~ 同正式設定：帶副檔名的 API 路徑不能被下面的靜態檔 regex 攔走
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location ~ /\. {
        deny all;
        access_log off;
    }
    location ~* \.(env|sql|bak|old|conf|ini|log|sh)$|wp-config|phpinfo {
        deny all;
        access_log off;
    }
    # 任何帶副檔名的請求，檔案不存在即 404，不落入 SPA fallback
    # （SPA 路由不帶副檔名，故不受影響；消除 Backup File Disclosure 假陽性）
    # 帶 hash 的 bundle：檔名一變內容就一定不同，可以放心讓瀏覽器長期快取。
    # 用 expires 而不是 add_header Cache-Control —— 見下方 location / 的說明。
    location ^~ /assets/ {
        limit_req zone=static_limit burst=60 nodelay;
        expires 1y;
        try_files $uri =404;
    }

    location ~ "\.[A-Za-z0-9]{1,8}$" {
        limit_req zone=static_limit burst=60 nodelay;
        try_files $uri =404;
    }
    # index.html 的快取規則要放在這裡（location = 精確比對，優先權最高）。
    #
    # 為什麼不能只寫在下面的 location /：SPA 路徑（/staff-login、/login）是靠
    # try_files 內部轉址到 /index.html，而 nginx 轉址後會「重新比對一次 location」，
    # /index.html 帶副檔名，於是落到上面那條 \.[A-Za-z0-9]{1,8}$ 規則，
    # location / 裡的 expires 根本套不到。2026-09-08 實測踩到這個坑。
    location = /index.html {
        limit_req zone=static_limit burst=60 nodelay;
        expires -1;
    }

    # SPA 進入點 index.html 一律不快取。
    #
    # 為什麼一定要有這行：Vite 每次 build 都會換 bundle 的 hash 檔名並刪掉舊檔。
    # index.html 若沒有快取指示，瀏覽器會自行「猜」一個快取時間，
    # 於是舊的 index.html 會去要已被刪掉的 /assets/index-<舊hash>.js → 404 → 整頁空白。
    # 2026-09-08 部署後即實際發生（開發機瀏覽器白畫面，強制重載才好）。
    #
    # no-cache 不是「不快取」，而是「每次都先問伺服器」：
    # 內容沒變時靠 ETag 回 304，只有幾百 bytes，成本可忽略。
    #
    # ⚠️ 用 expires 而不是 add_header Cache-Control：nginx 的 add_header 只在
    # 「本層沒有任何 add_header」時才會繼承上層設定 —— 在這裡加一行 add_header，
    # server 區塊的 CSP、HSTS、X-Frame-Options 全部會從這個 location 消失。
    # expires 屬於另一組指令，不會觸發這個繼承規則。
    location / {
        limit_req zone=static_limit burst=60 nodelay;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
