# RentMate 正式部署（學校 VM）
#
# 網段隔離設計：
#   frontend_net：web(nginx) ↔ fastapi ↔ ocr —— 可連外（fastapi/ocr 要呼叫 Google API）
#   backend_net ：fastapi ↔ mysql —— internal: true，完全不可連外、不可被外部連入
#   對外只開 web 的 80/443；mysql 沒有 ports 區塊，3306 不對外
#
# 驗證方式（從校外機器）：
#   nmap -p 22,80,443,3306,8000,8787 <VM公網IP>
#   預期：只有 80(/443) open，其餘 closed/filtered

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "80:80"        # 唯一對外的服務（P2 加上 TLS 後補 443）
    depends_on:
      - fastapi
      - ocr
    networks:
      - frontend_net
    restart: unless-stopped

  fastapi:
    build: ./backend
    env_file: .env      # JWT_SECRET、GOOGLE_CLIENT_ID/SECRET、SMTP_* 等
    environment:
      # 覆寫為容器內的正確位址（.env 裡的值是本機開發用）
      DATABASE_URL: "mysql+pymysql://rentmate:${MYSQL_PASSWORD}@mysql:3306/115-RentMate"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      COOKIE_SECURE: "false"   # P2 上 TLS 後改 true
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 讓容器連得到跑在 VM 主機上的 Ollama
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped
    # 沒有 ports：外部進不來，只能透過 nginx proxy_pass

  ocr:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env      # JWT_SECRET（與 fastapi 同一組）、OCR_* 設定
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /keys/vision-key.json
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
    volumes:
      - ./key/vision-key.json:/keys/vision-key.json:ro   # Vision 金鑰唯讀掛載，不進 image
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend_net
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?請在 .env 設定 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "115-RentMate"
      MYSQL_USER: "rentmate"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?請在 .env 設定 MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend_net
    restart: unless-stopped
    # 注意：完全沒有 ports 區塊 → 3306 不對外

networks:
  frontend_net:
  backend_net:
    internal: true      # 資料庫網段與外界完全隔離

volumes:
  mysql_data:
