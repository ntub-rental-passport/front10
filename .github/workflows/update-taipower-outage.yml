name: Update Taipower planned outage data
on:
  schedule:
    - cron: '30 21 * * *' # Every day, 05:30 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: taipower-outage-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Fetch outage data
        run: python scripts/fetch_taipower_outage.py
      - name: Validate fetched data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/data/taipower-outage.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data, list):
              raise SystemExit('Outage data must be a JSON list')
          if not data:
              raise SystemExit('Outage data must contain at least one record')
          print(f'Validated {len(data)} outage records')
          PY
      - name: Commit updated data
        run: |
          if git diff --quiet -- public/data/taipower-outage.json public/data/taipower-outage-source.json; then
            echo 'No outage data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/taipower-outage.json public/data/taipower-outage-source.json
          git commit -m 'chore(outage): 更新台電計畫性停電資料'
          git push origin HEAD
